<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="elements.css" />
  <style>
    html, body { background: transparent; overflow: hidden; }
    body { padding: 0; user-select: none; }
    .card {
      position: relative; height: 100%; display: flex; flex-direction: column;
      background: var(--wl-surface); border: 1px solid var(--wl-line);
      border-radius: var(--wl-r-md); box-shadow: var(--wl-shadow-sm);
      overflow: hidden; cursor: default;
    }
    .card.on { border-color: var(--wl-mint-line); box-shadow: 0 0 0 2px var(--wl-mint-bg), var(--wl-shadow-sm); }
    @keyframes ref-in { from { opacity: 0; transform: translateY(8px) scale(.96); } to { opacity: 1; transform: none; } }
    .card { animation: ref-in 220ms cubic-bezier(.2, .8, .2, 1); }
    .card.off .shot { opacity: .45; }
    .head {
      display: flex; align-items: center; gap: 6px; height: 24px; flex: 0 0 24px;
      padding: 0 6px 0 7px; background: var(--wl-surface-2);
      border-bottom: 1px solid var(--wl-line-soft); cursor: move;
    }
    .dot {
      width: 9px; height: 9px; flex: 0 0 9px; border-radius: 50%; padding: 0;
      background: transparent; border: 1.5px solid var(--wl-text-ghost); cursor: pointer;
    }
    .dot.on { background: var(--wl-mint); border-color: var(--wl-mint); box-shadow: 0 0 6px var(--wl-mint-line); }
    .name {
      flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      font-size: 10px; color: var(--wl-text-dim);
    }
    .x {
      flex: 0 0 auto; width: 16px; height: 16px; border-radius: 4px; padding: 0;
      background: none; border: 0; color: var(--wl-text-muted); font-size: 12px; line-height: 1;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
    }
    .x:hover { color: var(--wl-red-text); background: var(--wl-red-bg); }
    .shot { flex: 1; min-height: 0; background: var(--wl-code); }
    .shot img { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }
    .resize {
      position: absolute; right: 0; bottom: 0; width: 16px; height: 16px;
      cursor: nwse-resize; opacity: .6;
      background: linear-gradient(135deg, transparent 48%, var(--wl-text-ghost) 50%, transparent 56%),
                  linear-gradient(135deg, transparent 66%, var(--wl-text-ghost) 68%, transparent 74%);
    }
    .resize:hover { opacity: 1; }
  </style>
</head>
<body>
  <div class="card on" id="card">
    <div class="head" id="head">
      <button class="dot on" id="dot" title="Include / exclude in chat" aria-label="Toggle include"></button>
      <span class="name" id="name">reference</span>
      <button class="x" id="remove" title="Remove this reference" aria-label="Remove">×</button>
    </div>
    <div class="shot"><img id="img" alt="" draggable="false" /></div>
    <div class="resize" id="resize" title="Resize"></div>
  </div>
  <script>
    const WL = () => window.wl || {};
    const els = { card: document.getElementById('card'), head: document.getElementById('head'), dot: document.getElementById('dot'), name: document.getElementById('name'), remove: document.getElementById('remove'), img: document.getElementById('img'), resize: document.getElementById('resize') };
    let item = null;
    let drag = null;
    let resize = null;

    function render(it) {
      item = it;
      els.name.textContent = it.name || 'reference';
      els.name.title = it.name || '';
      els.img.src = it.thumb || '';
      els.card.classList.toggle('on', !!it.include);
      els.card.classList.toggle('off', !it.include);
      els.dot.classList.toggle('on', !!it.include);
      els.card.title = (it.name || '') + (it.width ? ` · ${it.width}×${it.height}` : '');
    }

    if (WL().onRefItem) WL().onRefItem((d) => { if (d && d.id) render(d); });

    els.head.addEventListener('mousedown', (e) => {
      if (e.button !== 0 || e.target.closest('button')) return;
      drag = { x: e.screenX, y: e.screenY };
      e.preventDefault();
    });
    els.resize.addEventListener('mousedown', (e) => {
      if (e.button !== 0) return;
      resize = { x: e.screenX, y: e.screenY };
      e.preventDefault();
      e.stopPropagation();
    });
    document.addEventListener('mousemove', (e) => {
      if (drag && item && WL().refMove) {
        const dx = e.screenX - drag.x;
        const dy = e.screenY - drag.y;
        if (dx || dy) { drag.x = e.screenX; drag.y = e.screenY; WL().refMove({ id: item.id, dx, dy }); }
      }
      if (resize && item && WL().refResize) {
        const dw = e.screenX - resize.x;
        const dh = e.screenY - resize.y;
        if (dw || dh) { resize.x = e.screenX; resize.y = e.screenY; WL().refResize({ id: item.id, dw, dh }); }
      }
    });
    document.addEventListener('mouseup', () => {
      if ((drag || resize) && WL().refMoveEnd) WL().refMoveEnd();
      drag = null;
      resize = null;
    });

    els.dot.addEventListener('click', (e) => {
      e.stopPropagation();
      if (item && WL().toggleRef) WL().toggleRef(item.id).catch?.(() => {});
    });
    els.remove.addEventListener('click', (e) => {
      e.stopPropagation();
      if (item && WL().removeRef) WL().removeRef(item.id).catch?.(() => {});
    });
  </script>
</body>
</html>
