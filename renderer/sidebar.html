<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="elements.css" />
  <style>
    html, body { background: transparent; }
    body {
      background: var(--wl-bg); color: var(--wl-text-2); overflow: hidden;
      font-family: var(--wl-font); font-size: var(--wl-fs-md);
      display: flex; flex-direction: column;
    }
    .head { padding: 16px 14px 10px; border-bottom: 1px solid var(--wl-line); }
    .proj { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 13px; color: var(--wl-text); }
    .dot { width: 8px; height: 8px; border-radius: 3px; background: linear-gradient(135deg, var(--wl-blue), var(--wl-violet)); }
    .repo { margin-top: 4px; font-family: var(--wl-mono); font-size: var(--wl-fs-xs); color: var(--wl-text-faint);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .branch { margin-top: 3px; font-family: var(--wl-mono); font-size: 10.5px; color: var(--wl-mint);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .sb-note { margin-top: 5px; font-size: 9.5px; color: var(--wl-blue-dim); }
    .scroller { flex: 1; overflow-y: auto; padding: 10px 10px 14px; }
    .sec { display: flex; align-items: center; justify-content: space-between; margin: 10px 4px 6px; }
    .sec .label { color: var(--wl-text-faint); font-size: var(--wl-fs-xs); font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
    .sec button { background: none; border: 0; color: var(--wl-text-faint); font-size: var(--wl-fs-sm); cursor: pointer; padding: 0; }
    .sec button:hover { color: var(--wl-blue-dim); }
    .file { display: flex; align-items: center; gap: 6px; width: 100%; text-align: left; cursor: pointer;
      background: var(--wl-surface); border: 1px solid var(--wl-line); border-radius: 7px;
      padding: 5px 8px; margin-bottom: 4px; color: #c7d3e8; font-family: var(--wl-mono); font-size: 10.5px; }
    .file:hover { border-color: var(--wl-blue-line); background: var(--wl-blue-bg); }
    .file .st { flex: 0 0 14px; text-align: center; font-weight: 700; }
    .st.M { color: var(--wl-blue); } .st.A, .st.U, .st["?" ] { color: var(--wl-mint); } .st.D { color: var(--wl-red-text); }
    .file .path { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; }
    .file .num { color: var(--wl-text-faint); font-size: 9.5px; white-space: nowrap; }
    .pagerow { display: flex; align-items: center; gap: 2px; }
    .pagerow .chat { flex: 1; text-align: left; }
    /* Pages get their own bounded scroller so they never push Recent chats off-screen */
    .pages-box {
      max-height: 238px; overflow-y: auto; padding: 3px;
      background: var(--wl-bg); border: 1px solid var(--wl-line-soft); border-radius: var(--wl-r-sm);
    }
    .pages-box .empty { padding: 8px; }
    .pgadd { background: none; border: 0; color: var(--wl-text-ghost); font-size: 15px; cursor: pointer;
      padding: 0 7px; line-height: 1; font-family: inherit; }
    .pgadd:hover { color: var(--wl-mint); }
    .num .a { color: var(--wl-mint); } .num .d { color: var(--wl-red-text); }
    .chat { display: block; width: 100%; text-align: left; cursor: pointer; background: none; border: 0;
      color: var(--wl-text-dim); font-size: 11.5px; padding: 5px 8px; border-radius: 7px; font-family: inherit; }
    .chat:hover { background: var(--wl-surface-3); color: var(--wl-text); }
    .chat.on { background: var(--wl-line); color: var(--wl-text); }
    .empty { color: var(--wl-text-ghost); font-size: var(--wl-fs-sm); padding: 4px 8px; text-align: left; line-height: 1.6; }
    .foot { border-top: 1px solid var(--wl-line); padding: 10px 14px; display: flex; align-items: center; gap: 8px; }
    .attach-row { display: flex; gap: 6px; padding: 0 14px 10px; }
    .attach-row input { flex: 1; min-width: 0; font-size: 10.5px; padding: 4px 7px; }
    .srv { flex: 1; color: var(--wl-text-faint); font-size: 10.5px; }
    .srv b { color: var(--wl-blue-dim); font-weight: 600; }
  </style>
</head>
<body>
  <div class="head">
    <div class="proj"><span class="dot"></span><span id="proj">project</span></div>
    <div class="repo" id="repo" hidden></div>
    <div class="branch" id="branch">—</div>
    <div class="sb-note" id="sb-note" hidden>⧉ sandbox · folder untouched</div>
  </div>
  <div class="scroller">
    <div class="sec"><span class="label">Pages</span><button id="pages-refresh" title="Rescan routes">↻</button></div>
    <div id="pages" class="pages-box"><div class="empty">—</div></div>
    <div class="sec"><span class="label">Recent chats</span></div>
    <div id="chats"><div class="empty">—</div></div>
  </div>
  <div class="foot">
    <div class="srv" id="srv">server <b>idle</b></div>
    <button class="wl-btn icon sm" id="attach" title="Attach to a running dev server">⇢</button>
    <button class="wl-btn icon sm danger" id="restart" title="Restart the dev server">⟳</button>
    <button class="wl-btn danger sm" id="stop">stop</button>
  </div>
  <div class="attach-row" id="attach-row" hidden>
    <input class="wl-input" id="attach-url" placeholder="localhost:8000" />
    <button class="wl-btn sm" id="attach-go">attach</button>
  </div>
  <script>
    if (navigator.userAgent.includes('Mac')) document.body.classList.add('mac');
    const WL = () => window.wl || {}; // read the bridge at CALL time — parse-time binding races the preload
    const $ = (i) => document.getElementById(i);
    let folder = null;
    let activeRoute = '/';

    function markActive() {
      document.querySelectorAll('#pages .chat').forEach((b) => b.classList.toggle('on', b.dataset.route === activeRoute));
    }

    async function refreshPages() {
      if (!WL().pagesList) return;
      const list = await WL().pagesList().catch(() => []);
      const box = $('pages');
      box.innerHTML = '';
      if (!list.length) { box.innerHTML = '<div class="empty">No routes found.</div>'; return; }
      for (const p of list.slice(0, 30)) {
        const row = document.createElement('div');
        row.className = 'pagerow';
        const b = document.createElement('button');
        b.className = 'chat';
        b.textContent = p.route;
        b.title = p.file;
        b.dataset.route = p.route;
        b.onclick = () => { activeRoute = p.route; markActive(); WL().sidebarUi && WL().sidebarUi('navigate', p.route); };
        const add = document.createElement('button');
        add.className = 'pgadd';
        add.textContent = '+';
        add.title = 'Open ' + p.route + ' in a new tab';
        add.onclick = () => WL().sidebarUi && WL().sidebarUi('addFrame', p.route);
        row.append(b, add);
        box.appendChild(row);
      }
      markActive();
    }
    async function refreshGit() {
      if (!WL().gitStatus) return;
      const r = await WL().gitStatus().catch(() => null);
      const repo = $('repo');
      if (!r || !r.ok) { repo.hidden = true; $('branch').textContent = '—'; return; }
      if (r.repo) { repo.hidden = false; repo.textContent = r.repo; repo.title = r.remote || r.repo; }
      else repo.hidden = true;
      const branch = /^withlook\/sandbox-/.test(r.branch || '') ? 'sandbox' : r.branch;
      $('branch').textContent = branch ? '⎇ ' + branch : '';
      $('branch').title = r.branch || '';
    }

    async function refreshChats() {
      const list = await WL().sessionsList(folder).catch(() => []);
      $('chats').innerHTML = '';
      if (!list.length) { $('chats').innerHTML = '<div class="empty">No conversations yet.</div>'; return; }
      for (const s of list.slice(0, 12)) {
        const b = document.createElement('button');
        b.className = 'chat';
        b.textContent = (s.title || 'Untitled chat').slice(0, 34);
        b.title = (s.project || '') + ' · ' + new Date(s.updated_at).toLocaleString();
        b.onclick = () => WL().sidebarUi && WL().sidebarUi('loadSession', s.id);
        $('chats').appendChild(b);
      }
    }
    window.addEventListener('DOMContentLoaded', () => {
      const wl = WL();
      $('pages-refresh').onclick = refreshPages;
      $('stop').onclick = () => WL().stopDev && WL().stopDev();
      $('restart').onclick = () => WL().restartDev && WL().restartDev();
      $('attach').onclick = () => {
        const row = $('attach-row');
        row.hidden = !row.hidden;
        if (!row.hidden) $('attach-url').focus();
      };
      const doAttach = async () => {
        const url = $('attach-url').value.trim();
        if (!url) return;
        $('attach-go').disabled = true;
        const r = await (WL().devAttach ? WL().devAttach(url) : Promise.resolve(null)).catch(() => null);
        $('attach-go').disabled = false;
        if (r && r.ok) { $('attach-row').hidden = true; $('attach-url').value = ''; }
        else { $('srv').textContent = (r && r.error) || 'attach failed'; }
      };
      $('attach-go').onclick = doAttach;
      $('attach-url').addEventListener('keydown', (e) => { if (e.key === 'Enter') doAttach(); });
      if (wl.onGitRefresh) wl.onGitRefresh(() => { refreshPages(); refreshGit(); });
      if (wl.onSessionsChanged) wl.onSessionsChanged(() => refreshChats());
      if (wl.onPageNav) wl.onPageNav((info) => {
        try { activeRoute = new URL(info.url).pathname || '/'; } catch {}
        markActive();
      });
      const applyDev = (d) => {
        if (!d) return;
        folder = d.projectFolder || d.folder || folder;
        const project = d.projectFolder || d.folder;
        $('proj').textContent = project ? String(project).split(/[\\/]/).filter(Boolean).pop() : 'project';
        $('srv').innerHTML = 'server <b>' + d.state + '</b>' + (d.port ? ' · :' + d.port : '');
        $('sb-note').hidden = !d.sandbox;
        if (d.sandbox) $('sb-note').title = d.sandbox.projectPath || d.sandbox.root || '';
        if (d.state === 'running') { refreshChats(); refreshPages(); refreshGit(); }
      };
      if (wl.onDevStatus) wl.onDevStatus(applyDev);
      // the sidebar can mount after the project is already running — hydrate from the current status
      if (wl.devStatus) wl.devStatus().then(applyDev).catch(() => {});
      refreshChats(); refreshPages(); refreshGit();
    });
  </script>
</body>
</html>
