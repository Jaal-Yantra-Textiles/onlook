<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>New project · withlook</title>
  <link rel="stylesheet" href="elements.css" />
  <style>
    body {
      display: flex; align-items: center; justify-content: center; padding: 32px 20px;
      background: radial-gradient(900px 480px at 30% -10%, #17171b, var(--wl-bg) 60%);
      font-family: var(--wl-font-sans);
      opacity: 0; transition: opacity .16s ease;
    }
    body.ready { opacity: 1; }
    .c { width: 620px; max-width: 100%; max-height: 100%; display: flex; flex-direction: column; }
    .head { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
    .dot { width: 28px; height: 28px; border-radius: 8px;
      background: conic-gradient(from 210deg, #6ea8ff, #9d7bff, #5ce1c7, #6ea8ff);
      box-shadow: 0 8px 28px rgba(110,168,255,0.35); }
    h1 { font-size: 16px; font-weight: 650; letter-spacing: -0.01em; margin: 0; flex: 1; }
    .back { margin-left: auto; }
    .sub { color: var(--wl-text-muted); font-size: var(--wl-fs-md); margin: 0 0 18px 38px; }
    .tpl-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; overflow-y: auto; }
    .tpl { display: flex; flex-direction: column; gap: 3px; text-align: left; padding: 11px 13px; cursor: pointer;
      background: var(--wl-input); border: 1px solid var(--wl-line); border-radius: var(--wl-r-md); color: var(--wl-text);
      font-family: inherit;
      transition: background var(--wl-dur) ease, border-color var(--wl-dur) ease; }
    .tpl:hover { background: var(--wl-surface-2); border-color: var(--wl-line-strong); }
    .tpl.on { border-color: var(--wl-line-strong); background: var(--wl-surface-3); box-shadow: 0 0 0 3px var(--wl-blue-bg); }
    .tpl-name { font-size: 12.5px; font-weight: 600; }
    .tpl-hint { font-size: var(--wl-fs-xs); color: var(--wl-text-muted); line-height: 1.4; }
    .tpl.on .tpl-hint { color: var(--wl-text-dim); }
    .loc { display: block; line-height: 36px; justify-content: flex-start; text-align: left; color: var(--wl-text-dim); font-weight: 400;
      background: transparent; margin-bottom: 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .loc:hover { color: var(--wl-text); background: var(--wl-surface-2); }
    #repo-row, #cmd-row { margin-bottom: 2px; }
    #repo-row .wl-input, #cmd-row .wl-input { margin-bottom: 10px; }
    .hint { font-size: var(--wl-fs-xs); color: var(--wl-text-muted); margin: -4px 0 10px; line-height: 1.5; }
    code { background: var(--wl-surface-2); border: 1px solid var(--wl-line); border-radius: 4px; padding: 0 4px; font-size: 0.95em; }
    .go { margin-top: 2px; }
    .stop { display: block; margin: 12px auto 0; }
    .status { min-height: 20px; margin-top: 14px; font-size: var(--wl-fs-md); color: var(--wl-text-dim);
      text-align: center; display: flex; align-items: center; justify-content: center; gap: 7px; }
    .status.err { color: var(--wl-red-text); }
    details { margin-top: 12px; text-align: left; }
    summary { cursor: pointer; font-size: var(--wl-fs-sm); color: var(--wl-text-ghost); }
    pre { max-height: 170px; overflow-y: auto; font-size: var(--wl-fs-xs); line-height: 1.5; color: var(--wl-text-dim);
      background: var(--wl-code); border: 1px solid var(--wl-line); border-radius: var(--wl-r-sm); padding: 10px;
      white-space: pre-wrap; margin: 8px 0 0; }
    @media (prefers-reduced-motion: reduce) { body { transition: none; } }
  </style>
</head>
<body>
  <div class="c">
    <div class="head">
      <div class="dot"></div>
      <h1>New project</h1>
      <button class="wl-btn sm ghost back" id="back" type="button">← Dashboard</button>
    </div>
    <p class="sub">Pick a starting point — everything is editable afterwards.</p>

    <div class="tpl-grid" id="templates"></div>

    <button class="wl-btn block loc" id="loc" type="button">Choose where to create it…</button>
    <input class="wl-input" id="name" placeholder="Project name (e.g. my-app)" spellcheck="false" autocomplete="off" />
    <div id="repo-row" hidden>
      <input class="wl-input" id="repo" placeholder="https://github.com/owner/repo" spellcheck="false" autocomplete="off" />
      <input class="wl-input" id="branch" placeholder="Branch (optional — uses the default branch)" spellcheck="false" autocomplete="off" />
    </div>
    <div id="cmd-row" hidden>
      <input class="wl-input mono" id="cmd" placeholder="npm create vite@latest . -- --template react-ts" spellcheck="false" autocomplete="off" />
      <div class="hint">Runs inside the new folder — use <code>.</code> as the target.</div>
    </div>

    <button class="wl-btn primary block go" id="go" type="button">Create project</button>
    <button class="wl-btn danger stop" id="stop" type="button" hidden>Stop</button>
    <div class="status" id="status"></div>
    <details id="logs-box" hidden><summary>scaffold output</summary><pre id="logs"></pre></details>
  </div>
  <script>
    (function () {
      const $ = (id) => document.getElementById(id);
      const WL = () => window.withlook || {};
      const FALLBACK = [
        { id: 'next', label: 'Next.js', hint: 'App Router · TypeScript · Tailwind', kind: 'command' },
        { id: 'vite-react', label: 'Vite + React', hint: 'React 19 · TypeScript', kind: 'command' },
        { id: 'vite-vue', label: 'Vite + Vue', hint: 'Vue 3 · TypeScript', kind: 'command' },
        { id: 'vite-svelte', label: 'Vite + Svelte', hint: 'Svelte 5 · TypeScript', kind: 'command' },
        { id: 'astro', label: 'Astro', hint: 'Minimal · content-first', kind: 'command' },
        { id: 'html', label: 'Plain HTML', hint: 'No tooling · served locally', kind: 'html' },
        { id: 'github', label: 'GitHub repo', hint: 'Clone a boilerplate or starter', kind: 'clone' },
        { id: 'custom', label: 'Custom', hint: 'Run your own scaffold command', kind: 'custom' },
      ];
      const els = {
        templates: $('templates'), loc: $('loc'), name: $('name'), go: $('go'), status: $('status'),
        logs: $('logs'), logsBox: $('logs-box'), stop: $('stop'), repoRow: $('repo-row'), cmdRow: $('cmd-row'),
        repo: $('repo'), branch: $('branch'), cmd: $('cmd'), back: $('back'),
      };
      let templates = FALLBACK;
      let selected = 'next';
      let parent = null;
      let busy = false;

      const kindOf = (id) => (templates.find((t) => t.id === id) || {}).kind || 'command';
      const labelOf = (id) => (templates.find((t) => t.id === id) || {}).label || 'project';

      function renderTemplates() {
        els.templates.innerHTML = '';
        for (const t of templates) {
          const b = document.createElement('button');
          b.type = 'button';
          b.className = 'tpl' + (t.id === selected ? ' on' : '');
          b.dataset.id = t.id;
          const n = document.createElement('span');
          n.className = 'tpl-name';
          n.textContent = t.label;
          const h = document.createElement('span');
          h.className = 'tpl-hint';
          h.textContent = t.hint;
          b.append(n, h);
          b.addEventListener('click', () => {
            if (busy) return;
            selected = t.id;
            renderTemplates();
            syncFields();
          });
          els.templates.appendChild(b);
        }
      }
      function syncFields() {
        const kind = kindOf(selected);
        els.repoRow.hidden = kind !== 'clone';
        els.cmdRow.hidden = kind !== 'custom';
        els.go.textContent = 'Create ' + labelOf(selected);
        els.name.placeholder = kind === 'clone' ? 'Folder name for the clone' : 'Project name (e.g. my-app)';
      }
      function setBusy(b) {
        busy = b;
        els.go.disabled = b;
        els.loc.disabled = b;
        els.name.disabled = b;
        els.repo.disabled = b;
        els.branch.disabled = b;
        els.cmd.disabled = b;
        els.stop.hidden = !b;
      }
      function fail(msg) {
        els.status.className = 'status err';
        els.status.textContent = msg;
      }

      els.loc.addEventListener('click', async () => {
        if (busy || !WL().pickCreateLocation) return;
        const p = await WL().pickCreateLocation();
        if (p) { parent = p; els.loc.textContent = p; els.loc.title = p; }
      });
      els.back.addEventListener('click', () => { if (WL().uiAction) WL().uiAction('home'); });
      els.stop.addEventListener('click', async () => {
        if (!busy || !WL().cancelCreate) return;
        els.stop.disabled = true;
        els.status.className = 'status';
        els.status.innerHTML = '<span class="wl-spinner"></span>Cancelling…';
        await WL().cancelCreate();
      });
      els.go.addEventListener('click', async () => {
        if (busy || !WL().submitCreate) return;
        const name = els.name.value.trim();
        const kind = kindOf(selected);
        if (!parent) { fail('Choose a location first.'); return; }
        if (!name) { fail('Enter a project name.'); return; }
        if (kind === 'clone' && !els.repo.value.trim()) { fail('Paste the repository URL.'); return; }
        if (kind === 'custom' && !els.cmd.value.trim()) { fail('Enter the scaffold command.'); return; }
        setBusy(true);
        els.status.className = 'status';
        const verb = kind === 'clone' ? 'Cloning the repository'
          : kind === 'html' ? 'Writing the starter files'
          : kind === 'custom' ? 'Running your command'
          : 'Scaffolding with ' + labelOf(selected);
        els.status.innerHTML = '<span class="wl-spinner"></span>' + verb + '…';
        const r = await WL().submitCreate({
          parent, name, template: selected,
          repo: els.repo.value.trim(), branch: els.branch.value.trim(), command: els.cmd.value.trim(),
        });
        if (r && r.ok) { els.status.textContent = 'Created ✓ — opening the dashboard…'; return; }
        setBusy(false);
        els.stop.disabled = false;
        fail((r && r.error) || 'Failed — check the output below.');
      });
      els.name.addEventListener('keydown', (e) => { if (e.key === 'Enter') els.go.click(); });

      if (WL().onCreateStatus) WL().onCreateStatus((s) => {
        if (s.phase === 'error') { setBusy(false); fail(s.error || 'failed'); }
        else if (s.phase === 'cancelled') { setBusy(false); els.stop.disabled = false; els.status.className = 'status'; els.status.textContent = 'Cancelled.'; }
        else if (s.phase === 'created') { setBusy(false); els.stop.hidden = true; els.status.className = 'status'; els.status.textContent = 'Created ✓ — opening the dashboard…'; }
        else if (s.phase === 'starting') els.status.innerHTML = '<span class="wl-spinner"></span>Starting dev server…';
      });
      if (WL().onCreateLog) WL().onCreateLog((l) => {
        els.logsBox.hidden = false;
        els.logs.textContent += l + '\n';
        els.logs.scrollTop = els.logs.scrollHeight;
      });

      // fade in on the first painted frame, then fill the template list
      requestAnimationFrame(() => requestAnimationFrame(() => document.body.classList.add('ready')));
      renderTemplates();
      syncFields();
      (async () => {
        try {
          const list = WL().createTemplates ? await WL().createTemplates() : null;
          if (Array.isArray(list) && list.length) { templates = list; renderTemplates(); syncFields(); }
        } catch {}
      })();
    })();
  </script>
</body>
</html>
