<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    :root { --card: #0f0f12; --border: #27272a; --fg: #f4f4f5; --muted: #a1a1aa; }
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
    body {
      display: flex; align-items: center; justify-content: center;
      background: rgba(9, 9, 11, 0.62);
      font-family: ui-sans-serif, -apple-system, 'Inter', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      display: flex; align-items: center; gap: 12px;
      background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; padding: 13px 20px; color: var(--fg);
      font-size: 12.5px; box-shadow: 0 18px 50px rgba(0,0,0,0.55);
    }
    .spin {
      width: 14px; height: 14px; border-radius: 50%;
      border: 2px solid #27272a; border-top-color: #fafafa;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #label { min-width: 130px; transition: opacity 160ms ease; }
    #label.fade { opacity: 0; }
    .dots { color: var(--muted); }
  </style>
</head>
<body>
  <div class="card"><span class="spin"></span><span id="label">loading</span><span class="dots">…</span></div>
  <script>
    const WORDS = [
      'loading', 'compiling', 'designing', 'warming the canvas', 'arranging pixels',
      'consulting the build', 'polishing edges', 'almost there', 'brewing modules',
      'tidying components', 'spinning up', 'thinking in layouts'
    ];
    let i = 0;
    const el = () => document.getElementById('label');
    window.__setLabel = (t) => { const e = el(); if (e) e.textContent = t; };
    window.addEventListener('DOMContentLoaded', () => {
      setInterval(() => {
        const e = el();
        if (!e) return;
        e.classList.add('fade');
        setTimeout(() => {
          i = (i + 1) % WORDS.length;
          e.textContent = WORDS[i];
          e.classList.remove('fade');
        }, 170);
      }, 1700);
    });
  </script>
</body>
</html>
