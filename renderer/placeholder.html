<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>withlook</title>
  <link rel="stylesheet" href="elements.css" />
  <style>
    :root {
      --bg: var(--wl-bg); --side: var(--wl-bg-bar); --card: var(--wl-surface); --border: var(--wl-line); --border-soft: var(--wl-line-soft);
      --fg: var(--wl-text); --muted: var(--wl-text-dim); --dim: var(--wl-text-muted); --faint: var(--wl-text-ghost);
      --accent: var(--wl-accent); --teal: var(--wl-mint); --blue: var(--wl-blue); --violet: var(--wl-violet);
    }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg); color: var(--fg);
      font-family: var(--wl-font-sans);
      overflow: hidden;
    }
    button { font-family: inherit; cursor: pointer; }
    svg { flex: 0 0 auto; }

    .app { display: flex; height: 100%; }
    /* ---------- sidebar ---------- */
    .side {
      width: 248px; flex: 0 0 248px; display: flex; flex-direction: column;
      background: var(--side); border-right: 1px solid var(--border-soft);
      padding: 18px 14px 14px;
    }
    .brand { display: flex; align-items: center; gap: 9px; padding: 2px 8px 20px; }
    .brand .dot { width: 22px; height: 22px; border-radius: 7px;
      background: conic-gradient(from 210deg, var(--blue), var(--violet), var(--teal), var(--blue));
      box-shadow: 0 4px 16px rgba(110,168,255,0.35); }
    .brand .name { font-size: 14.5px; font-weight: 650; letter-spacing: -0.01em; }
    .beta { font-size: 9.5px; font-weight: 650; color: var(--teal); background: rgba(92,225,199,0.1);
      border: 1px solid rgba(92,225,199,0.28); border-radius: 999px; padding: 2px 7px; margin-left: 2px; }

    .btn {
      display: flex; align-items: center; gap: 9px; width: 100%; height: 36px;
      border-radius: 9px; font-size: 12.5px; font-weight: 550; padding: 0 11px;
      transition: background 120ms ease, border-color 120ms ease, transform 60ms ease;
    }
    .btn:active { transform: translateY(1px); }
    .btn.primary { background: var(--accent); color: #09090b; border: 1px solid var(--accent); }
    .btn.primary:hover { background: #e4e4e7; }
    .btn.ghost { background: transparent; color: var(--fg); border: 1px solid var(--border); margin-top: 8px; }
    .btn.ghost:hover { background: #141417; border-color: #3f3f46; }
    .open-split { position: relative; display: flex; }
    .open-split #btn-open { flex: 1 1 auto; width: auto; border-radius: 9px 0 0 9px; }
    .open-split .caret { flex: 0 0 auto; width: 30px; padding: 0; justify-content: center;
      border-radius: 0 9px 9px 0; border-left: 1px solid rgba(9,9,11,0.2); }
    .open-menu { position: absolute; top: 40px; left: 0; right: 0; z-index: 6; padding: 4px;
      background: #141417; border: 1px solid var(--border); border-radius: 10px;
      box-shadow: 0 14px 34px rgba(0,0,0,0.45); }
    .open-menu button { display: block; width: 100%; text-align: left; background: none; border: 0;
      color: var(--fg); font-size: 12px; padding: 8px 9px; border-radius: 7px; cursor: pointer; font-family: inherit; }
    .open-menu button:hover { background: #232326; }

    .nav { display: flex; flex-direction: column; gap: 2px; margin-top: 18px; }
    .nav button {
      display: flex; align-items: center; gap: 10px; height: 34px; width: 100%;
      background: none; border: 0; border-radius: 8px; color: var(--muted);
      font-size: 12.5px; padding: 0 10px; text-align: left;
    }
    .nav button:hover { background: #141417; color: var(--fg); }
    .nav button.on { background: #1a1a1e; color: var(--fg); }
    .nav button svg { color: var(--dim); }
    .nav button.on svg, .nav button:hover svg { color: var(--fg); }

    .side-label { margin: 22px 10px 8px; font-size: 9.5px; font-weight: 650; color: var(--faint);
      text-transform: uppercase; letter-spacing: .09em; }
    .workspaces { display: flex; flex-direction: column; gap: 1px; overflow-y: auto; min-height: 0; }
    .workspaces::-webkit-scrollbar { width: 6px; }
    .workspaces::-webkit-scrollbar-thumb { background: #27272a; border-radius: 3px; }
    .ws { display: flex; align-items: center; gap: 9px; height: 32px; width: 100%;
      background: none; border: 0; border-radius: 7px; color: var(--muted);
      font-size: 12px; padding: 0 10px; text-align: left; }
    .ws:hover { background: #141417; color: var(--fg); }
    .ws svg { color: var(--dim); }
    .ws .ws-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
    .ws-x { flex: 0 0 18px; width: 18px; height: 18px; border-radius: 5px; display: flex;
      align-items: center; justify-content: center; font-size: 11px; color: var(--dim);
      opacity: 0; cursor: pointer; }
    .ws:hover .ws-x { opacity: 1; }
    .ws-x:hover { color: #f87171; background: rgba(248,113,113,0.1); }
    .ws-empty { color: var(--faint); font-size: 11px; padding: 4px 10px; }
    .spacer { flex: 1 1 auto; }

    .promo {
      border: 1px solid var(--border); border-radius: 11px; padding: 12px;
      background: linear-gradient(160deg, rgba(110,168,255,0.06), rgba(157,123,255,0.03) 60%, transparent);
      margin-bottom: 12px;
    }
    .promo-title { font-size: 12px; font-weight: 650; margin-bottom: 4px; }
    .promo p { margin: 0 0 9px; font-size: 10.5px; line-height: 1.5; color: var(--dim); }
    .promo button { width: 100%; height: 30px; border-radius: 7px; border: 1px solid var(--border);
      background: #18181b; color: var(--fg); font-size: 11px; font-weight: 550; }
    .promo button:hover { background: #232326; border-color: #3f3f46; }

    .me { display: flex; align-items: center; gap: 10px; padding: 6px 6px 2px; }
    .avatar { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 700; color: #09090b;
      background: conic-gradient(from 210deg, var(--blue), var(--violet), var(--teal), var(--blue)); }
    .me-name { font-size: 12px; font-weight: 600; }
    .me-sub { font-size: 10px; color: var(--dim); margin-top: 1px; }

    /* ---------- main ---------- */
    main { flex: 1 1 auto; min-width: 0; overflow-y: auto; padding: 34px 40px 48px; }
    main::-webkit-scrollbar { width: 10px; }
    main::-webkit-scrollbar-thumb { background: #27272a; border-radius: 5px; }
    .head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 22px; }
    h1 { font-size: 21px; font-weight: 650; letter-spacing: -0.02em; margin: 0 0 5px; }
    .sub { color: var(--dim); font-size: 12.5px; }
    .count { color: var(--faint); font-size: 11px; font-family: ui-monospace, Menlo, monospace; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 18px; }
    .card {
      position: relative;
      display: flex; flex-direction: column; align-items: stretch; text-align: left; padding: 0;
      background: var(--card); border: 1px solid var(--border); border-radius: 13px;
      overflow: hidden; color: var(--fg);
      transition: border-color 140ms ease, transform 140ms ease, box-shadow 140ms ease;
    }
    .card-remove {
      position: absolute; top: 8px; left: 8px; z-index: 2;
      width: 20px; height: 20px; border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; color: #d4d4d8; cursor: pointer;
      background: rgba(9,9,11,0.72); border: 1px solid rgba(255,255,255,0.14);
      opacity: 0; transition: opacity 120ms ease;
    }
    .card:hover .card-remove { opacity: 1; }
    .card-remove:hover { color: #f87171; border-color: rgba(248,113,113,0.45); }
    .card-remove.armed { opacity: 1; color: #f87171; border-color: rgba(248,113,113,0.55); background: rgba(248,113,113,0.14); }
    .card:hover { border-color: #3f3f46; transform: translateY(-1px); box-shadow: 0 12px 30px rgba(0,0,0,0.35); }
    .thumb {
      position: relative; height: 148px; padding: 16px 18px 0; overflow: hidden;
      background:
        radial-gradient(120% 120% at 20% 0%, hsl(var(--hue, 210) 55% 22% / 0.55), transparent 60%),
        linear-gradient(160deg, hsl(var(--hue, 210) 30% 13%), #0a0a0d 75%);
      border-bottom: 1px solid var(--border-soft);
    }
    .thumb-chrome { display: flex; align-items: center; gap: 5px; margin-bottom: 12px; }
    .thumb-chrome i { width: 5px; height: 5px; border-radius: 50%; background: rgba(255,255,255,0.22); display: block; }
    .thumb-chrome .addr { flex: 1; height: 12px; border-radius: 4px; background: rgba(255,255,255,0.07); margin-left: 5px; }
    .mini {
      width: 100%; height: 100%; border-radius: 8px 8px 0 0; background: rgba(255,255,255,0.94);
      padding: 12px 13px; display: flex; flex-direction: column; gap: 7px;
      box-shadow: 0 -1px 0 rgba(255,255,255,0.2);
    }
    .mini .bar { height: 6px; border-radius: 3px; background: #d9d9df; }
    .mini .bar.dark { background: #232329; }
    .mini .w70 { width: 70%; } .mini .w45 { width: 45%; } .mini .w30 { width: 30%; }
    .mini .blocks { display: flex; gap: 6px; margin-top: 2px; }
    .mini .blocks span { flex: 1; height: 30px; border-radius: 5px; background: #ececf1; }
    .runbadge {
      position: absolute; top: 12px; right: 12px; font-size: 9px; font-weight: 650;
      color: var(--teal); background: rgba(9,9,11,0.72); border: 1px solid rgba(92,225,199,0.4);
      border-radius: 999px; padding: 2.5px 8px; backdrop-filter: blur(6px);
    }
    .runbadge::before { content: '●'; margin-right: 4px; font-size: 7px; vertical-align: 1px; }
    .card-body { padding: 11px 14px 13px; }
    .card-name { font-size: 12.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .card-meta { margin-top: 3px; font-size: 10.5px; color: var(--dim);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .card-meta .when { color: var(--faint); }

    .newcard {
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 7px;
      min-height: 205px; border: 1px dashed #3f3f46; border-radius: 13px;
      background: rgba(255,255,255,0.015); color: var(--dim);
    }
    .newcard:hover { border-color: #52525b; color: var(--fg); background: rgba(255,255,255,0.03); }
    .newcard .plus { width: 34px; height: 34px; border-radius: 10px; display: flex; align-items: center; justify-content: center;
      background: #18181b; border: 1px solid var(--border); font-size: 17px; color: var(--muted); }
    .newcard .t { font-size: 12px; font-weight: 550; }
    .newcard .s { font-size: 10.5px; color: var(--faint); }

    .empty-wrap { display: flex; align-items: center; justify-content: center; min-height: 58vh; }
    .onboard {
      width: min(520px, 100%); padding: 32px 30px 28px;
      border: 1px solid var(--border); border-radius: 18px;
      background:
        linear-gradient(160deg, rgba(110,168,255,0.07), rgba(157,123,255,0.03) 55%, transparent),
        var(--card);
    }
    .ob-brand { display: flex; align-items: center; gap: 9px; font-size: 13px; font-weight: 650; margin-bottom: 20px; }
    .ob-brand .dot { width: 20px; height: 20px; border-radius: 6px;
      background: conic-gradient(from 210deg, var(--blue), var(--violet), var(--teal), var(--blue)); }
    .onboard h2 { font-size: 19px; font-weight: 650; letter-spacing: -0.02em; margin: 0 0 6px; }
    .onboard p { color: var(--dim); font-size: 12.5px; line-height: 1.65; margin: 0 0 20px; }
    .ob-steps { display: flex; flex-direction: column; gap: 10px; margin-bottom: 24px; }
    .ob-steps div { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--muted); }
    .ob-steps b { width: 22px; height: 22px; flex: 0 0 22px; border-radius: 7px;
      background: #18181b; border: 1px solid var(--border); color: var(--fg);
      display: flex; align-items: center; justify-content: center; font-size: 10.5px; }
    .ob-actions { display: flex; gap: 10px; }
    .ob-primary { flex: 1; height: 38px; border-radius: 9px; border: 1px solid var(--accent);
      background: var(--accent); color: #09090b; font-size: 12.5px; font-weight: 600; }
    .ob-primary:hover { background: #e4e4e7; }
    .ob-secondary { flex: 1; height: 38px; border-radius: 9px; border: 1px solid var(--border);
      background: transparent; color: var(--fg); font-size: 12.5px; font-weight: 550; }
    .ob-secondary:hover { background: #141417; border-color: #3f3f46; }
    .foot-hint { margin-top: 26px; color: var(--faint); font-size: 10.5px; }
    kbd { background: #18181b; border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 5px;
      padding: 1px 5px; font-size: 9.5px; font-family: ui-monospace, Menlo, monospace; color: var(--muted); }
  </style>
</head>
<body>
  <div class="app">
    <aside class="side">
      <div class="brand"><div class="dot"></div><span class="name">withlook</span><span class="beta">Beta</span></div>

      <div class="open-split">
        <button class="btn primary" id="btn-open">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.5A2.5 2.5 0 0 1 5.5 5h3l2 2.5h8A2.5 2.5 0 0 1 21 10v7.5a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5v-10z"/><path d="M12 11v6M9 14h6"/></svg>
          Open project
        </button>
        <button class="btn primary caret" id="btn-open-more" title="Open options">▾</button>
        <div class="open-menu" id="open-menu" hidden>
          <button id="open-menu-open">Open project…</button>
          <button id="open-menu-attach">Attach to running server…</button>
        </div>
      </div>
      <button class="btn ghost" id="btn-new">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M12 11v6M9 14h6"/></svg>
        New project
      </button>

      <nav class="nav">
        <button class="on" id="nav-recent">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
          Recent projects
        </button>
        <button id="nav-settings">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
          Settings
        </button>
      </nav>

      <div class="side-label">Workspaces</div>
      <div class="workspaces" id="workspaces"><div class="ws-empty">No workspaces yet</div></div>

      <div class="spacer"></div>

      <div class="promo">
        <div class="promo-title">Local-first by design</div>
        <p>Your code, keys, and chats stay on this machine.</p>
        <button id="promo-open">Open a project</button>
      </div>

      <div class="me">
        <div class="avatar">w</div>
        <div><div class="me-name">withlook</div><div class="me-sub" id="me-sub">v—</div></div>
      </div>
    </aside>

    <main>
      <div class="head">
        <div>
          <h1>Recent projects</h1>
          <div class="sub">Pick up where you left off.</div>
        </div>
        <div class="count" id="count"></div>
      </div>
      <div id="content"></div>
      <div class="foot-hint">Open a project to pick elements (<kbd>⌘E</kbd>), focus chat (<kbd>⌘K</kbd>), and zoom the canvas (<kbd>⌘+</kbd>/<kbd>⌘−</kbd>).</div>
    </main>
  </div>

  <script>
    const send = (a) => { if (window.withlook && window.withlook.uiAction) window.withlook.uiAction(a); };
    const timeAgo = (ts) => {
      if (!ts) return '';
      const s = Math.max(1, Math.floor((Date.now() - new Date(ts).getTime()) / 1000));
      if (s < 60) return s + 's ago';
      if (s < 3600) return Math.floor(s / 60) + 'm ago';
      if (s < 86400) return Math.floor(s / 3600) + 'h ago';
      return Math.floor(s / 86400) + 'd ago';
    };
    const shortPath = (p) => String(p || '').replace(/^\/Users\/[^/]+/, '~');
    const HUES = [210, 265, 165, 32, 320, 190];

    function projectName(p) {
      return p.name || String(p.folder || '').split('/').filter(Boolean).pop() || 'project';
    }

    async function removeProject(p) {
      const name = projectName(p);
      const r = await (window.withlook && window.withlook.removeProject
        ? window.withlook.removeProject(p.folder).catch(() => ({ ok: false }))
        : Promise.resolve({ ok: false }));
      if (r && r.ok) load();
      else alert('Could not remove ' + name);
    }
    const armed = new WeakMap();
    function armRemove(el, p) {
      if (armed.get(el)) { armed.delete(el); removeProject(p); return; }
      armed.set(el, true);
      el.classList.add('armed');
      el.textContent = '!';
      el.title = 'Click again to remove ' + projectName(p);
      setTimeout(() => {
        if (!armed.get(el)) return;
        armed.delete(el);
        el.classList.remove('armed');
        el.textContent = '×';
        el.title = 'Remove from withlook (keeps the folder)';
      }, 2500);
    }

    function card(p, i, running) {
      const b = document.createElement('button');
      b.className = 'card';
      const isRunning = running.state === 'running' && running.folder === p.folder;
      b.innerHTML =
        '<div class="thumb" style="--hue:' + HUES[i % HUES.length] + '">' +
          '<div class="thumb-chrome"><i></i><i></i><i></i><span class="addr"></span></div>' +
          '<div class="mini"><div class="bar dark w30"></div><div class="bar w70"></div><div class="bar w45"></div>' +
            '<div class="blocks"><span></span><span></span><span></span></div></div>' +
          (isRunning ? '<span class="runbadge">running</span>' : '') +
        '</div>' +
        '<div class="card-body"><div class="card-name"></div><div class="card-meta"><span class="path"></span><span class="when"></span></div></div>';
      b.querySelector('.card-name').textContent = projectName(p);
      b.querySelector('.path').textContent = p.repo || shortPath(p.folder);
      b.querySelector('.when').textContent = p.last_opened_at ? ' · ' + timeAgo(p.last_opened_at) : '';
      b.title = p.folder + (p.repo ? ' · ' + p.repo : '');
      b.addEventListener('click', () => send({ action: 'openFolder', folder: p.folder }));
      const x = document.createElement('span');
      x.className = 'card-remove';
      x.textContent = '×';
      x.title = 'Remove from withlook (keeps the folder)';
      x.setAttribute('role', 'button');
      x.addEventListener('click', (e) => { e.stopPropagation(); e.preventDefault(); armRemove(x, p); });
      b.appendChild(x);
      return b;
    }

    function newCard() {
      const b = document.createElement('button');
      b.className = 'newcard';
      b.innerHTML = '<span class="plus">+</span><span class="t">New project</span><span class="s">Start from a template</span>';
      b.addEventListener('click', () => send('create'));
      return b;
    }

    async function load() {
      let data = null;
      try { data = window.withlook && window.withlook.welcome ? await window.withlook.welcome() : null; } catch (_) {}
      const projects = (data && data.projects) || [];
      const running = (data && data.running) || { state: 'idle', folder: null };
      if (data && data.version) document.getElementById('me-sub').textContent = 'v' + data.version + ' · local';
      document.getElementById('count').textContent = projects.length
        ? projects.length + ' project' + (projects.length === 1 ? '' : 's')
        : '';

      // sidebar workspaces
      const ws = document.getElementById('workspaces');
      ws.innerHTML = '';
      if (projects.length) {
        for (const p of projects.slice(0, 6)) {
          const b = document.createElement('button');
          b.className = 'ws';
          b.innerHTML = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.5A2.5 2.5 0 0 1 5.5 5h3l2 2.5h8A2.5 2.5 0 0 1 21 10v7.5a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5v-10z"/></svg><span class="ws-name"></span>';
          b.querySelector('.ws-name').textContent = projectName(p);
          b.title = p.folder;
          b.addEventListener('click', () => send({ action: 'openFolder', folder: p.folder }));
          const x = document.createElement('span');
          x.className = 'ws-x';
          x.textContent = '×';
          x.title = 'Remove from withlook (keeps the folder)';
          x.setAttribute('role', 'button');
          x.addEventListener('click', (e) => { e.stopPropagation(); e.preventDefault(); armRemove(x, p); });
          b.appendChild(x);
          ws.appendChild(b);
        }
      } else {
        ws.innerHTML = '<div class="ws-empty">No workspaces yet</div>';
      }

      // main grid
      const content = document.getElementById('content');
      content.innerHTML = '';
      if (!projects.length) {
        content.innerHTML =
          '<div class="empty-wrap"><div class="onboard">' +
            '<div class="ob-brand"><span class="dot"></span>withlook <span class="beta">Beta</span></div>' +
            '<h2>Welcome to withlook</h2>' +
            '<p>Preview your local web app, pick any element, and ask an AI that can see the code behind it.</p>' +
            '<div class="ob-steps">' +
              '<div><b>1</b> Open an existing project or create a new one</div>' +
              '<div><b>2</b> Pick an element on the live page with ⌘E</div>' +
              '<div><b>3</b> Ask in the chat pill — edits land in your repo</div>' +
            '</div>' +
            '<div class="ob-actions">' +
              '<button class="ob-primary" id="empty-open">Open project…</button>' +
              '<button class="ob-secondary" id="empty-new">Create a project</button>' +
            '</div>' +
          '</div></div>';
        document.getElementById('empty-open').addEventListener('click', () => send('open'));
        document.getElementById('empty-new').addEventListener('click', () => send('create'));
        return;
      }
      const grid = document.createElement('div');
      grid.className = 'grid';
      projects.slice(0, 24).forEach((p, i) => grid.appendChild(card(p, i, running)));
      grid.appendChild(newCard());
      content.appendChild(grid);
    }

    window.addEventListener('DOMContentLoaded', () => {
      document.getElementById('btn-open').addEventListener('click', () => send('open'));
      document.getElementById('btn-new').addEventListener('click', () => send('create'));
      document.getElementById('promo-open').addEventListener('click', () => send('open'));
      document.getElementById('nav-settings').addEventListener('click', () => send('settings'));
      document.getElementById('nav-recent').addEventListener('click', () => document.querySelector('main').scrollTo({ top: 0, behavior: 'smooth' }));
      const openMore = document.getElementById('btn-open-more');
      const openMenu = document.getElementById('open-menu');
      const hideOpenMenu = () => { openMenu.hidden = true; };
      openMore.addEventListener('click', (e) => { e.stopPropagation(); openMenu.hidden = !openMenu.hidden; });
      document.getElementById('open-menu-open').addEventListener('click', () => { hideOpenMenu(); send('open'); });
      document.getElementById('open-menu-attach').addEventListener('click', () => { hideOpenMenu(); send({ action: 'attach' }); });
      document.addEventListener('click', (e) => { if (!openMenu.hidden && !e.target.closest('.open-split')) hideOpenMenu(); });
      load();
    });
  </script>
</body>
</html>
